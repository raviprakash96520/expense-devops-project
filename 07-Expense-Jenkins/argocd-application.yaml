apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: expense
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/raviprakash96520/expense-devops-project.git
    targetRevision: main
    path: 07-Expense-Jenkins/helm
    helm:
      releaseName: expense
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: expense

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true